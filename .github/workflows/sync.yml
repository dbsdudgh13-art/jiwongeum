name: 공공데이터 동기화

on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = KST 04:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: API 동기화
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_ENDPOINT: ${{ vars.DATA_GO_KR_ENDPOINT }}
        run: npm run sync

      - run: npm run normalize

      # linkcheck 는 여기서 돌리지 않는다.
      # gov.kr 이 해외 IP 를 막아 GitHub 러너에서는 살아 있는 링크도 전부 실패한다.
      # 실제로 6건 전부 죽었다고 기록됐고, 그대로 머지됐다면 발행 페이지 전체가
      # noindex 처리될 뻔했다. 링크 검사는 국내에서 'npm run linkcheck' 로 한다.

      - name: 변경 요약 읽기
        id: diff
        run: |
          node -e "
            const d = require('./data/normalized/diff.json');
            const n = d.added.length + d.changed.length + d.removed.length;
            console.log('count=' + n);
            console.log('body=신규 ' + d.added.length + ' / 변경 ' + d.changed.length + ' / 종료 ' + d.removed.length);
          " >> "$GITHUB_OUTPUT"

      - name: 변경분 PR 생성
        if: steps.diff.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/auto-sync
          title: '데이터 동기화 ${{ github.run_number }}'
          body: |
            공공데이터 자동 동기화 결과.

            ${{ steps.diff.outputs.body }}

            머지 전에 로컬에서 `업데이트` 를 실행해 해설 문서를 반영할 것.
          commit-message: 'chore: 공공데이터 동기화'
          labels: data-changed
          # PR 이 머지되거나 닫히면 브랜치를 지운다.
          # 브랜치가 남아 있으면 다음 실행이 그것을 갱신만 하고 새 PR 을 만들지 않아,
          # 변경분이 어디에도 보이지 않는 상태가 된다. 실제로 그렇게 됐다.
          delete-branch: true
          add-paths: |
            data/
