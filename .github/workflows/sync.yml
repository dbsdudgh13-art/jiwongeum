name: 공공데이터 동기화

on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = KST 04:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run contentcheck

      - name: API 동기화
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_ENDPOINT: ${{ vars.DATA_GO_KR_ENDPOINT }}
        run: npm run sync

      - run: npm run normalize

      # linkcheck 는 여기서 돌리지 않는다.
      # gov.kr 이 해외 IP 를 막아 GitHub 러너에서는 살아 있는 링크도 전부 실패한다.
      # 실제로 6건 전부 죽었다고 기록됐고, 그대로 머지됐다면 발행 페이지 전체가
      # noindex 처리될 뻔했다. 링크 검사는 국내에서 'npm run linkcheck' 로 한다.

      - name: 변경 요약 읽기
        id: diff
        run: |
          node -e "
            const d = require('./data/normalized/diff.json');
            const total = d.added.length + d.changed.length + d.removed.length;
            console.log('count=' + total);
            console.log('affected=' + d.affectsPublished.length);
            console.log('body=신규 ' + d.added.length + ' / 변경 ' + d.changed.length + ' / 종료 ' + d.removed.length);
            console.log('affectedIds=' + d.affectsPublished.join(', '));
          " >> "$GITHUB_OUTPUT"

      # 발행된 문서와 무관한 변경이면 사람을 부르지 않는다.
      # 데이터는 기계 생성물이고 normalize 가 급감 가드를 이미 갖고 있다.
      - name: 자동 반영 (발행분 영향 없음)
        if: steps.diff.outputs.count != '0' && steps.diff.outputs.affected == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "chore: 공공데이터 동기화

          ${{ steps.diff.outputs.body }}

          발행된 문서의 원자료는 바뀌지 않아 해설 재작성 없이 반영한다."
          git push

      # 발행된 문서의 원자료가 바뀌면 요약 박스와 해설 본문이 어긋난다.
      # 이때만 PR 로 세워 사람이 보게 한다.
      - name: 검토 요청 PR (발행분 영향 있음)
        if: steps.diff.outputs.affected != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/needs-review
          title: '검토 필요: 발행된 지원금 ${{ steps.diff.outputs.affected }}건의 원자료가 바뀌었습니다'
          body: |
            ${{ steps.diff.outputs.body }}

            ## 해설 재작성이 필요한 문서

            ${{ steps.diff.outputs.affectedIds }}

            이 문서들은 이미 발행돼 있고 원자료가 바뀌었습니다. 요약 박스는 새 값으로
            바뀌지만 해설 본문은 옛 내용을 설명하고 있어 페이지 안에서 모순이 생깁니다.

            머지하기 전에 로컬에서 `업데이트` 를 실행해 해당 문서를 다시 쓰십시오.
          commit-message: 'chore: 공공데이터 동기화 (발행분 영향)'
          labels: needs-review
          delete-branch: true
          add-paths: |
            data/
